<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Feliz cumpleaños, Elida Joana</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#02030c;
    font-family:Arial,sans-serif;
    touch-action:none;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

.title{
    position:fixed;
    top:8%;
    width:100%;
    text-align:center;
    z-index:10;
    pointer-events:none;
    color:white;
    text-shadow:
        0 0 8px #fff,
        0 0 20px #9c7cff,
        0 0 40px #6845ff;
}

.title h1{
    font-size:clamp(28px,7vw,65px);
    letter-spacing:2px;
}

.title p{
    margin-top:8px;
    font-size:clamp(18px,4vw,30px);
    opacity:.9;
}

.hint{
    position:fixed;
    bottom:5%;
    width:100%;
    text-align:center;
    color:#ffffffaa;
    font-size:13px;
    z-index:10;
    pointer-events:none;
}

.message{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) scale(.7);
    color:white;
    font-size:clamp(18px,5vw,32px);
    text-align:center;
    text-shadow:0 0 15px #fff,0 0 30px #8f6cff;
    opacity:0;
    pointer-events:none;
    transition:.5s;
    z-index:20;
    width:85%;
}

.message.show{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
}
</style>
</head>

<body>

<canvas id="space"></canvas>

<div class="title">
    <h1>✨ Feliz cumpleaños, Elida Joana ✨</h1>
    <p>(Dormilona 😴)</p>
</div>

<div class="message" id="message"></div>

<div class="hint">
    🔍 Haz zoom • 🖐️ Arrastra • 🌌 Explora la galaxia
</div>

<script>

const canvas = document.getElementById("space");
const ctx = canvas.getContext("2d");
const message = document.getElementById("message");

let W,H;
let zoom=1;
let targetZoom=1;

let offsetX=0;
let offsetY=0;

let dragging=false;
let lastX=0;
let lastY=0;

let time=0;

function resize(){
    W=canvas.width=window.innerWidth;
    H=canvas.height=window.innerHeight;
}

window.addEventListener("resize",resize);
resize();


// -----------------------------
// ESTRELLAS
// -----------------------------

const stars=[];

for(let i=0;i<650;i++){

    stars.push({
        x:Math.random()*W,
        y:Math.random()*H,
        r:Math.random()*2.3+.3,
        brightness:Math.random(),
        twinkle:Math.random()*Math.PI*2,
        color:[
            "#ffffff",
            "#b9d7ff",
            "#ffe8b5",
            "#d6c8ff"
        ][Math.floor(Math.random()*4)]
    });

}


// -----------------------------
// ESTRELLAS GRANDES
// -----------------------------

const bigStars=[];

for(let i=0;i<35;i++){

    bigStars.push({
        x:Math.random()*W,
        y:Math.random()*H,
        size:Math.random()*5+3,
        angle:Math.random()*Math.PI
    });

}


// -----------------------------
// PLANETAS
// -----------------------------

const planets=[
    {
        x:-360,
        y:-120,
        r:65,
        color:"#c87d42",
        type:"jupiter"
    },
    {
        x:390,
        y:100,
        r:38,
        color:"#9c7047",
        type:"saturn"
    },
    {
        x:250,
        y:-230,
        r:25,
        color:"#4d7d91",
        type:"planet"
    },
    {
        x:-260,
        y:260,
        r:20,
        color:"#b44c3c",
        type:"planet"
    }
];


// -----------------------------
// PARTÍCULAS
// -----------------------------

const particles=[];

for(let i=0;i<180;i++){

    particles.push({
        angle:Math.random()*Math.PI*2,
        distance:80+Math.random()*480,
        speed:.0005+Math.random()*.002,
        size:Math.random()*2+0.5
    });

}


// -----------------------------
// AURORA BOREAL
// -----------------------------

function drawAurora(){

    ctx.save();

    ctx.globalAlpha=.25;

    for(let i=0;i<5;i++){

        const gradient=ctx.createLinearGradient(
            0,0,
            W,0
        );

        gradient.addColorStop(0,"rgba(0,255,180,0)");
        gradient.addColorStop(.3,"rgba(0,255,180,.35)");
        gradient.addColorStop(.5,"rgba(90,255,200,.5)");
        gradient.addColorStop(.7,"rgba(80,130,255,.35)");
        gradient.addColorStop(1,"rgba(0,255,180,0)");

        ctx.fillStyle=gradient;

        ctx.beginPath();

        for(let x=0;x<=W;x+=10){

            let y=
                H*.12+
                Math.sin(x*.008+time*.002+i)*50+
                Math.sin(x*.003-time*.001)*35;

            ctx.lineTo(x,y);
        }

        ctx.lineTo(W,0);
        ctx.lineTo(0,0);
        ctx.closePath();

        ctx.fill();
    }

    ctx.restore();
}


// -----------------------------
// FONDO
// -----------------------------

function drawBackground(){

    const gradient=ctx.createRadialGradient(
        W/2,H/2,0,
        W/2,H/2,
        Math.max(W,H)
    );

    gradient.addColorStop(0,"#111746");
    gradient.addColorStop(.35,"#070b27");
    gradient.addColorStop(1,"#01020a");

    ctx.fillStyle=gradient;
    ctx.fillRect(0,0,W,H);

    drawAurora();
}


// -----------------------------
// ESTRELLAS
// -----------------------------

function drawStars(){

    stars.forEach(s=>{

        let twinkle=
            .65+
            Math.sin(time*.04+s.twinkle)*.35;

        ctx.globalAlpha=twinkle;

        ctx.fillStyle=s.color;

        ctx.beginPath();

        ctx.arc(
            s.x,
            s.y,
            s.r,
            0,
            Math.PI*2
        );

        ctx.fill();
    });

    ctx.globalAlpha=1;


    // estrellas brillantes

    bigStars.forEach(s=>{

        ctx.save();

        ctx.translate(s.x,s.y);
        ctx.rotate(s.angle);

        const glow=ctx.createRadialGradient(
            0,0,0,
            0,0,s.size*5
        );

        glow.addColorStop(0,"white");
        glow.addColorStop(.15,"#ffffffcc");
        glow.addColorStop(1,"transparent");

        ctx.fillStyle=glow;

        ctx.beginPath();

        ctx.arc(0,0,s.size*5,0,Math.PI*2);

        ctx.fill();


        ctx.strokeStyle="white";
        ctx.globalAlpha=.9;

        ctx.beginPath();

        ctx.moveTo(-s.size*3,0);
        ctx.lineTo(s.size*3,0);

        ctx.moveTo(0,-s.size*3);
        ctx.lineTo(0,s.size*3);

        ctx.stroke();

        ctx.restore();
    });

}


// -----------------------------
// GALAXIA
// -----------------------------

function drawGalaxy(){

    ctx.save();

    ctx.translate(
        W/2+offsetX,
        H/2+offsetY
    );

    ctx.scale(zoom,zoom);

    const rotation=time*.00025;

    ctx.rotate(rotation);

    // núcleo

    const core=ctx.createRadialGradient(
        0,0,0,
        0,0,130
    );

    core.addColorStop(0,"#ffffff");
    core.addColorStop(.08,"#fff6d5");
    core.addColorStop(.25,"#d5a6ff");
    core.addColorStop(.55,"#704cff");
    core.addColorStop(1,"transparent");

    ctx.fillStyle=core;

    ctx.beginPath();

    ctx.arc(0,0,150,0,Math.PI*2);

    ctx.fill();


    // brazos espirales

    for(let arm=0;arm<5;arm++){

        ctx.beginPath();

        for(let i=0;i<600;i++){

            const r=i*.8;

            const angle=
                i*.045+
                arm*Math.PI*2/5;

            const spread=
                Math.sin(i*.12)*25;

            const x=
                Math.cos(angle)*r+
                spread;

            const y=
                Math.sin(angle)*r*.43;

            const alpha=
                Math.max(0,1-r/500);

            ctx.fillStyle=
                `rgba(160,130,255,${alpha*.55})`;

            ctx.fillRect(
                x,
                y,
                2.5,
                2.5
            );
        }
    }


    // partículas orbitando

    particles.forEach(p=>{

        p.angle+=p.speed;

        const x=
            Math.cos(p.angle)*p.distance;

        const y=
            Math.sin(p.angle)*p.distance*.43;

        ctx.globalAlpha=.7;

        ctx.fillStyle="#ffffff";

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();
    });

    ctx.globalAlpha=1;

    ctx.restore();
}


// -----------------------------
// PLANETAS
// -----------------------------

function drawPlanets(){

    ctx.save();

    ctx.translate(
        W/2+offsetX,
        H/2+offsetY
    );

    ctx.scale(zoom,zoom);


    planets.forEach(p=>{

        ctx.save();

        ctx.translate(p.x,p.y);


        // sombra/glow

        const glow=ctx.createRadialGradient(
            0,0,p.r*.5,
            0,0,p.r*1.8
        );

        glow.addColorStop(
            0,
            p.color+"88"
        );

        glow.addColorStop(
            1,
            "transparent"
        );

        ctx.fillStyle=glow;

        ctx.beginPath();

        ctx.arc(
            0,0,
            p.r*1.8,
            0,
            Math.PI*2
        );

        ctx.fill();


        // Saturno

        if(p.type==="saturn"){

            ctx.save();

            ctx.rotate(-.25);

            ctx.strokeStyle="#d7bd91";
            ctx.globalAlpha=.8;

            ctx.lineWidth=8;

            ctx.beginPath();

            ctx.ellipse(
                0,0,
                p.r*1.8,
                p.r*.55,
                0,
                0,
                Math.PI*2
            );

            ctx.stroke();

            ctx.restore();
        }


        // planeta

        const planetGradient=
            ctx.createRadialGradient(
                -p.r*.3,
                -p.r*.35,
                p.r*.1,
                0,
                0,
                p.r
            );

        planetGradient.addColorStop(
            0,
            "#ffffffaa"
        );

        planetGradient.addColorStop(
            .2,
            p.color
        );

        planetGradient.addColorStop(
            1,
            "#050509"
        );

        ctx.fillStyle=planetGradient;

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            p.r,
            0,
            Math.PI*2
        );

        ctx.fill();


        // detalles de Júpiter

        if(p.type==="jupiter"){

            ctx.globalAlpha=.45;

            ctx.strokeStyle="#f0c08c";

            ctx.lineWidth=5;

            for(let y=-25;y<30;y+=14){

                ctx.beginPath();

                ctx.moveTo(
                    -p.r*.75,
                    y
                );

                ctx.bezierCurveTo(
                    -20,y-8,
                    20,y+8,
                    p.r*.75,y
                );

                ctx.stroke();
            }

        }

        ctx.restore();

    });

    ctx.restore();
}


// -----------------------------
// ESTRELLAS FUGACES
// -----------------------------

function shootingStar(){

    const x=Math.random()*W;
    const y=Math.random()*H*.6;

    ctx.save();

    const gradient=ctx.createLinearGradient(
        x,y,
        x-120,y+80
    );

    gradient.addColorStop(0,"white");
    gradient.addColorStop(1,"transparent");

    ctx.strokeStyle=gradient;

    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.moveTo(x,y);
    ctx.lineTo(x-120,y+80);

    ctx.stroke();

    ctx.restore();
}


// -----------------------------
// ANIMACIÓN
// -----------------------------

let lastShoot=0;

function animate(){

    time++;

    drawBackground();
    drawStars();
    drawGalaxy();
    drawPlanets();


    if(time-lastShoot>170){

        shootingStar();
        lastShoot=time;
    }

    zoom +=
        (targetZoom-zoom)*.08;

    requestAnimationFrame(animate);
}

animate();


// -----------------------------
// ZOOM PC
// -----------------------------

canvas.addEventListener("wheel",e=>{

    e.preventDefault();

    if(e.deltaY<0)
        targetZoom*=1.12;
    else
        targetZoom/=1.12;

    targetZoom=
        Math.max(.45,Math.min(4,targetZoom));

});


// -----------------------------
// ARRASTRAR
// -----------------------------

canvas.addEventListener("pointerdown",e=>{

    dragging=true;

    lastX=e.clientX;
    lastY=e.clientY;

});

canvas.addEventListener("pointermove",e=>{

    if(!dragging)return;

    offsetX+=e.clientX-lastX;
    offsetY+=e.clientY-lastY;

    lastX=e.clientX;
    lastY=e.clientY;

});

canvas.addEventListener("pointerup",()=>{
    dragging=false;
});

canvas.addEventListener("pointercancel",()=>{
    dragging=false;
});


// -----------------------------
// ZOOM CON DOS DEDOS
// -----------------------------

let initialDistance=null;

canvas.addEventListener("touchstart",e=>{

    if(e.touches.length===2){

        initialDistance=
            Math.hypot(
                e.touches[0].clientX-
                e.touches[1].clientX,

                e.touches[0].clientY-
                e.touches[1].clientY
            );
    }

},{passive:false});


canvas.addEventListener("touchmove",e=>{

    if(e.touches.length===2){

        e.preventDefault();

        const distance=
            Math.hypot(
                e.touches[0].clientX-
                e.touches[1].clientX,

                e.touches[0].clientY-
                e.touches[1].clientY
            );

        if(initialDistance){

            const change=
                distance/initialDistance;

            targetZoom*=change;

            targetZoom=
                Math.max(
                    .45,
                    Math.min(4,targetZoom)
                );

        }

        initialDistance=distance;
    }

},{passive:false});


// -----------------------------
// FRASES AL EXPLORAR
// -----------------------------

const phrases=[

    "La dormilona apareció por aquí 😴✨",

    "Siempre haciendo de las tuyas 😂",

    "Hermana, pero también cómplice de aventuras 🚀",

    "Nivel de hermandad: otra galaxia 🌌",

    "Que nunca falten las risas 😂",

    "La galaxia necesitaba una Joana 😎",

    "Modo hermana activado 🪐",

    "Un pequeño universo para una gran hermana ✨",

    "Y sí... también hay espacio para tus ocurrencias 😂"

];

let phraseIndex=0;

function showPhrase(){

    message.innerText=
        phrases[phraseIndex];

    message.classList.add("show");

    phraseIndex=
        (phraseIndex+1)%phrases.length;

    setTimeout(()=>{

        message.classList.remove("show");

    },2600);
}


// mostrar frases ocasionalmente

setInterval(()=>{

    if(zoom>1.4){

        showPhrase();

    }

},7000);

</script>

</body>
    </html>
