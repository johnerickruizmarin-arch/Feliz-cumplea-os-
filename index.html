<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>Feliz cumpleaños, Lulú 🌌</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#02000a;
  font-family:Arial,sans-serif;
  touch-action:none;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
}

.titulo{
  position:fixed;
  z-index:20;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  pointer-events:none;
  padding:20px;
}

h1{
  font-size:clamp(40px,11vw,85px);
  color:white;
  text-shadow:
    0 0 10px white,
    0 0 25px #ff66e8,
    0 0 50px #a14dff,
    0 0 90px #6b43ff;
  animation:brillo 2.5s infinite ease-in-out;
}

.subtitulo{
  margin-top:15px;
  font-size:clamp(16px,4vw,25px);
  color:#fff;
  text-shadow:0 0 15px #ff71e6;
}

.corazon{
  margin-top:18px;
  font-size:50px;
  animation:flotar 2s infinite ease-in-out;
}

.instruccion{
  position:fixed;
  z-index:30;
  bottom:15px;
  left:0;
  width:100%;
  text-align:center;
  color:white;
  opacity:.6;
  font-size:12px;
  pointer-events:none;
}

@keyframes brillo{
  0%,100%{
    transform:scale(1);
  }
  50%{
    transform:scale(1.06);
  }
}

@keyframes flotar{
  0%,100%{
    transform:translateY(0);
  }
  50%{
    transform:translateY(-12px);
  }
}
</style>
</head>

<body>

<canvas id="galaxia"></canvas>

<div class="titulo">
  <h1>Feliz cumpleaños, Lulú 💖</h1>

  <div class="subtitulo">
    ✨ Hoy la galaxia brilla por ti ✨
  </div>

  <div class="corazon">💗</div>
</div>

<div class="instruccion">
  🤏 Haz zoom para descubrir mensajes · Arrastra para explorar 🌌
</div>

<script>

const canvas=document.getElementById("galaxia");
const ctx=canvas.getContext("2d");

let W,H;
let zoom=1;
let rotation=0;

let offsetX=0;
let offsetY=0;

function resize(){

  W=innerWidth;
  H=innerHeight;

  canvas.width=W*devicePixelRatio;
  canvas.height=H*devicePixelRatio;

  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(
    devicePixelRatio,
    0,
    0,
    devicePixelRatio,
    0,
    0
  );
}

resize();

window.addEventListener("resize",resize);


/* ==========================
   ESTRELLAS
========================== */

const estrellas=[];

for(let i=0;i<500;i++){

  estrellas.push({

    x:Math.random(),
    y:Math.random(),

    tamaño:
      Math.random()*2+0.3,

    brillo:
      Math.random()*Math.PI*2,

    velocidad:
      Math.random()*0.025+0.005

  });
}


/* ==========================
   PARTÍCULAS DE LA GALAXIA
========================== */

const particulas=[];

for(let i=0;i<2200;i++){

  const radio=
    Math.pow(Math.random(),0.65)*560;

  particulas.push({

    radio:radio,

    angulo:
      Math.random()*Math.PI*2,

    velocidad:
      0.0005+
      Math.random()*0.0018,

    tamaño:
      Math.random()*1.8+0.3,

    brazo:
      Math.floor(Math.random()*6),

    brillo:
      Math.random()

  });
}


/* ==========================
   MENSAJES OCULTOS
========================== */

const mensajes=[

  "Loquita 😂",
  "Eres increíble ✨",
  "Nunca cambies 😎",
  "Qué buena onda 🌟",
  "Por más risas 😂",
  "Feliz cumple 🎂",
  "Pásala genial 🥳",
  "Hoy toca brillar ✨",
  "Que se cumplan tus planes 🌠",
  "Más aventuras 🚀",
  "Siempre con buena vibra 😎",
  "Que la pases brutal 🔥",
  "Un año más de locuras 😂",
  "Disfruta tu día 🎉",
  "A seguir brillando ✨",
  "Modo cumpleaños: ACTIVADO 🎂"

];

const posiciones=[];

for(let i=0;i<mensajes.length;i++){

  posiciones.push({

    angulo:
      Math.random()*Math.PI*2,

    radio:
      220+
      Math.random()*300,

    texto:
      mensajes[i]

  });
}


/* ==========================
   CONTROLES TÁCTILES
========================== */

let arrastrando=false;

let ultimoX=0;
let ultimoY=0;

let distanciaInicial=0;


function distancia(a,b){

  const dx=
    a.clientX-b.clientX;

  const dy=
    a.clientY-b.clientY;

  return Math.sqrt(dx*dx+dy*dy);
}


canvas.addEventListener(
"touchstart",
e=>{

  if(e.touches.length===1){

    arrastrando=true;

    ultimoX=
      e.touches[0].clientX;

    ultimoY=
      e.touches[0].clientY;
  }

  if(e.touches.length===2){

    arrastrando=false;

    distanciaInicial=
      distancia(
        e.touches[0],
        e.touches[1]
      );
  }

},
{passive:false}
);


canvas.addEventListener(
"touchmove",
e=>{

  e.preventDefault();

  if(
    e.touches.length===1 &&
    arrastrando
  ){

    const x=
      e.touches[0].clientX;

    const y=
      e.touches[0].clientY;

    offsetX+=x-ultimoX;
    offsetY+=y-ultimoY;

    ultimoX=x;
    ultimoY=y;
  }


  if(e.touches.length===2){

    const nuevaDistancia=
      distancia(
        e.touches[0],
        e.touches[1]
      );

    const diferencia=
      nuevaDistancia-distanciaInicial;

    zoom+=diferencia*0.006;

    zoom=Math.max(
      0.6,
      Math.min(4,zoom)
    );

    distanciaInicial=
      nuevaDistancia;
  }

},
{passive:false}
);


canvas.addEventListener(
"touchend",
()=>{
  arrastrando=false;
}
);


/* ==========================
   MOUSE
========================== */

canvas.addEventListener(
"mousedown",
e=>{

  arrastrando=true;

  ultimoX=e.clientX;
  ultimoY=e.clientY;

});


window.addEventListener(
"mouseup",
()=>{
  arrastrando=false;
});


window.addEventListener(
"mousemove",
e=>{

  if(!arrastrando)return;

  offsetX+=
    e.clientX-ultimoX;

  offsetY+=
    e.clientY-ultimoY;

  ultimoX=e.clientX;
  ultimoY=e.clientY;

});


canvas.addEventListener(
"wheel",
e=>{

  e.preventDefault();

  zoom-=e.deltaY*0.001;

  zoom=Math.max(
    0.6,
    Math.min(4,zoom)
  );

},
{passive:false}
);


/* ==========================
   DIBUJAR LUNA
========================== */

function dibujarLuna(cx,cy){

  const tamaño=55*zoom;

  const gradiente=
    ctx.createRadialGradient(
      cx-tamaño*0.3,
      cy-tamaño*0.3,
      tamaño*0.1,
      cx,
      cy,
      tamaño
    );

  gradiente.addColorStop(
    0,
    "#ffffff"
  );

  gradiente.addColorStop(
    0.45,
    "#d8d7ff"
  );

  gradiente.addColorStop(
    1,
    "#7770b5"
  );

  ctx.beginPath();

  ctx.arc(
    cx,
    cy,
    tamaño,
    0,
    Math.PI*2
  );

  ctx.fillStyle=gradiente;

  ctx.shadowBlur=30;

  ctx.shadowColor="#b8a9ff";

  ctx.fill();

  ctx.shadowBlur=0;


  /* cráteres */

  const crateres=[
    [-.35,-.15,.12],
    [.25,-.35,.10],
    [.35,.15,.14],
    [-.15,.30,.09],
    [-.05,-.05,.07]
  ];

  crateres.forEach(c=>{

    ctx.beginPath();

    ctx.arc(
      cx+c[0]*tamaño,
      cy+c[1]*tamaño,
      c[2]*tamaño,
      0,
      Math.PI*2
    );

    ctx.fillStyle=
      "rgba(100,95,150,.35)";

    ctx.fill();

  });

}


/* ==========================
   ANIMACIÓN
========================== */

function animar(){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );

  ctx.fillStyle="#02000a";

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  /* estrellas */

  estrellas.forEach(e=>{

    e.brillo+=e.velocidad;

    const alpha=
      .25+
      Math.abs(
        Math.sin(e.brillo)
      )*.75;

    ctx.beginPath();

    ctx.arc(
      e.x*W,
      e.y*H,
      e.tamaño,
      0,
      Math.PI*2
    );

    ctx.fillStyle=
      `rgba(255,255,255,${alpha})`;

    ctx.fill();

  });


  const cx=
    W/2+offsetX;

  const cy=
    H/2+offsetY;


  /* rotación */

  rotation+=0.0018;


  /* galaxia */

  particulas.forEach(p=>{

    p.angulo+=p.velocidad;

    const brazo=
      p.brazo*
      (Math.PI*2/6);

    const angulo=
      p.angulo+
      rotation+
      brazo+
      p.radio*0.002;

    const radio=
      p.radio*zoom;

    const x=
      cx+
      Math.cos(angulo)*radio;

    const y=
      cy+
      Math.sin(angulo)*
      radio*.43;

    const alpha=
      Math.max(
        .05,
        1-radio/(650*zoom)
      );

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      p.tamaño*zoom,
      0,
      Math.PI*2
    );

    ctx.fillStyle=
      `rgba(
        ${150+Math.random()*100},
        ${80+Math.random()*100},
        255,
        ${alpha}
      )`;

    ctx.fill();

  });


  /* brillo central */

  const glow=
    ctx.createRadialGradient(
      cx,
      cy,
      0,
      cx,
      cy,
      300*zoom
    );

  glow.addColorStop(
    0,
    "rgba(255,180,255,.40)"
  );

  glow.addColorStop(
    .25,
    "rgba(190,90,255,.20)"
  );

  glow.addColorStop(
    .6,
    "rgba(80,80,255,.08)"
  );

  glow.addColorStop(
    1,
    "rgba(0,0,0,0)"
  );

  ctx.fillStyle=glow;

  ctx.beginPath();

  ctx.arc(
    cx,
    cy,
    300*zoom,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* ==========================
     LUNA
  ========================== */

  const lunaX=
    cx+
    Math.cos(rotation*.4)*380*zoom;

  const lunaY=
    cy-
    180*zoom+
    Math.sin(rotation*.4)*80;

  dibujarLuna(
    lunaX,
    lunaY
  );


  /* ==========================
     MENSAJES AL HACER ZOOM
  ========================== */

  if(zoom>1.45){

    posiciones.forEach((m,i)=>{

      const angulo=
        m.angulo+
        rotation*.6;

      const radio=
        m.radio*zoom;

      const x=
        cx+
        Math.cos(angulo)*radio;

      const y=
        cy+
        Math.sin(angulo)*
        radio*.55;

      const opacidad=
        Math.min(
          1,
          (zoom-1.45)*2
        );

      ctx.save();

      ctx.globalAlpha=opacidad;

      ctx.font=
        "bold 15px Arial";

      ctx.textAlign="center";

      ctx.shadowBlur=12;

      ctx.shadowColor="#ff64e7";

      ctx.fillStyle="#ffffff";

      ctx.fillText(
        m.texto,
        x,
        y
      );

      ctx.restore();

    });

  }


  /* partículas grandes */

  if(zoom>1.8){

    for(let i=0;i<35;i++){

      const a=
        rotation*2+i;

      const r=
        (100+((i*73)%400))*zoom;

      const x=
        cx+Math.cos(a)*r;

      const y=
        cy+Math.sin(a)*r*.5;

      ctx.beginPath();

      ctx.arc(
        x,
        y,
        Math.random()*3+1,
        0,
        Math.PI*2
      );

      ctx.fillStyle=
        "rgba(255,220,255,.9)";

      ctx.shadowBlur=15;

      ctx.shadowColor="#ff8bea";

      ctx.fill();

      ctx.shadowBlur=0;
    }

  }


  requestAnimationFrame(animar);

}

animar();

</script>

</body>
  </html>
