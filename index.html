<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CR7 — SIUUU GALAXY</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    background: #03030d;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    background: #03030d;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    text-align: center;
    touch-action: manipulation;
}

#universe {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
}

.nebula {
    position: fixed;
    inset: -30%;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse at 20% 30%,
        rgba(95, 30, 255, .25), transparent 35%),
      radial-gradient(ellipse at 80% 60%,
        rgba(0, 170, 255, .16), transparent 35%),
      radial-gradient(ellipse at 50% 90%,
        rgba(255, 30, 90, .14), transparent 30%);
    filter: blur(24px);
    animation: nebulaMove 18s ease-in-out infinite alternate;
}

@keyframes nebulaMove {
    from { transform: rotate(0deg) scale(1); }
    to { transform: rotate(12deg) scale(1.18); }
}

.page {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 15px 35px;
}

.badge {
    border: 1px solid rgba(255,255,255,.22);
    background: rgba(12, 12, 35, .62);
    border-radius: 40px;
    padding: 9px 17px;
    color: #d8d8ff;
    font-size: 11px;
    letter-spacing: 4px;
    box-shadow: 0 0 25px rgba(102, 65, 255, .2);
    backdrop-filter: blur(10px);
}

h1 {
    margin-top: 23px;
    font-size: clamp(27px, 7vw, 48px);
    font-weight: 1000;
    letter-spacing: 3px;
    line-height: 1.1;
    background: linear-gradient(
        90deg, #fff, #a9baff, #fff, #ffdf9c
    );
    background-size: 300% auto;
    color: transparent;
    background-clip: text;
    -webkit-background-clip: text;
    animation: titleShine 5s linear infinite;
    text-shadow: 0 0 35px rgba(128, 117, 255, .15);
}

@keyframes titleShine {
    to { background-position: 300% center; }
}

.subtitle {
    margin-top: 12px;
    color: #a9b0d8;
    font-size: 12px;
    letter-spacing: 3px;
}

.scene {
    width: min(92vw, 430px);
    height: 390px;
    position: relative;
    margin-top: 18px;
    display: grid;
    place-items: center;
    perspective: 1000px;
}

.orbit {
    position: absolute;
    width: 300px;
    height: 300px;
    border: 1px solid rgba(135, 153, 255, .22);
    border-radius: 50%;
    box-shadow:
        0 0 20px rgba(94, 79, 255, .08),
        inset 0 0 20px rgba(94, 79, 255, .08);
    animation: orbitSpin 18s linear infinite;
}

.orbit.two {
    width: 350px;
    height: 170px;
    border-color: rgba(255, 195, 125, .3);
    transform: rotate(-28deg);
    animation-duration: 12s;
    animation-direction: reverse;
}

.orbit.three {
    width: 260px;
    height: 360px;
    border-color: rgba(80, 201, 255, .18);
    animation-duration: 25s;
}

@keyframes orbitSpin {
    from { rotate: 0deg; }
    to { rotate: 360deg; }
}

.planet {
    position: absolute;
    width: 45px;
    height: 45px;
    border-radius: 50%;
    top: 55px;
    right: 42px;
    background: radial-gradient(
        circle at 30% 25%,
        #fff4cf, #f7a85b 35%, #7438a8 75%, #211344
    );
    box-shadow: 0 0 25px rgba(255, 166, 96, .55);
    animation: planetFloat 5s ease-in-out infinite;
}

.planet::after {
    content: "";
    position: absolute;
    width: 70px;
    height: 15px;
    border: 3px solid rgba(255, 212, 150, .7);
    border-radius: 50%;
    top: 14px;
    left: -15px;
    transform: rotate(-25deg);
}

@keyframes planetFloat {
    50% { transform: translateY(-13px); }
}

.photo-wrap {
    position: relative;
    width: 235px;
    height: 290px;
    display: grid;
    place-items: center;
    animation: heroFloat 4s ease-in-out infinite;
    transform-style: preserve-3d;
    transition: filter .3s;
}

.photo-wrap::before {
    content: "";
    position: absolute;
    width: 220px;
    height: 220px;
    border-radius: 50%;
    background: rgba(94, 81, 255, .28);
    filter: blur(45px);
}

.photo-wrap img {
    position: relative;
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center;
    border-radius: 18px;
    filter:
        drop-shadow(0 0 12px rgba(111, 127, 255, .45))
        drop-shadow(0 0 35px rgba(109, 52, 255, .25));
    -webkit-mask-image: linear-gradient(
        to bottom, black 0%, black 78%, transparent 100%
    );
    mask-image: linear-gradient(
        to bottom, black 0%, black 78%, transparent 100%
    );
}

@keyframes heroFloat {
    0%, 100% { transform: translateY(0) rotateY(-3deg); }
    50% { transform: translateY(-12px) rotateY(3deg); }
}

.photo-label {
    position: absolute;
    bottom: 3px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 5px;
    color: #e9eaff;
    text-shadow: 0 0 15px #7e72ff;
    white-space: nowrap;
}

#siuuu {
    position: relative;
    z-index: 3;
    margin-top: -2px;
    font-size: clamp(47px, 12vw, 82px);
    font-style: italic;
    font-weight: 1000;
    letter-spacing: -2px;
    line-height: 1;
    color: #fff;
    opacity: .92;
    text-shadow:
        0 0 5px #fff,
        0 0 15px #a99cff,
        0 0 35px #7850ff,
        0 0 70px #5232ff;
    transition: transform .2s;
}

#siuuu.pop {
    animation: siuPop 1.5s cubic-bezier(.2,.8,.2,1);
}

@keyframes siuPop {
    0% { transform: scale(.2) rotate(-12deg); opacity: 0; }
    35% { transform: scale(1.2) rotate(3deg); opacity: 1; }
    55% { transform: scale(.94); }
    75% { transform: scale(1.05); }
    100% { transform: scale(1); opacity: 1; }
}

.info {
    margin-top: 13px;
    font-size: 10px;
    letter-spacing: 4px;
    color: #a8aed4;
}

.button {
    margin-top: 27px;
    padding: 16px 27px;
    border: 1px solid rgba(255,255,255,.55);
    border-radius: 50px;
    background: linear-gradient(110deg, #6b48ff, #315dff, #a144ff);
    color: white;
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 2px;
    box-shadow:
        0 0 20px rgba(104, 74, 255, .45),
        inset 0 0 12px rgba(255,255,255,.12);
    cursor: pointer;
    transition: transform .2s, box-shadow .2s;
    animation: buttonGlow 3s ease-in-out infinite;
}

.button:active {
    transform: scale(.94);
}

@keyframes buttonGlow {
    50% {
        box-shadow: 0 0 35px rgba(104, 74, 255, .8);
    }
}

.hint {
    margin-top: 17px;
    font-size: 11px;
    color: #9299c5;
    line-height: 1.8;
}

.footer {
    margin-top: 28px;
    color: rgba(208, 212, 255, .48);
    font-size: 9px;
    letter-spacing: 4px;
}

.flash {
    position: fixed;
    inset: 0;
    z-index: 8;
    background: white;
    pointer-events: none;
    opacity: 0;
}

.flash.go {
    animation: flashEffect .6s ease-out;
}

@keyframes flashEffect {
    0% { opacity: 0; }
    12% { opacity: .85; }
    100% { opacity: 0; }
}

.shockwave {
    position: fixed;
    z-index: 5;
    width: 15px;
    height: 15px;
    border: 2px solid #fff;
    border-radius: 50%;
    pointer-events: none;
    box-shadow: 0 0 25px #8f7cff;
    animation: wave 1s ease-out forwards;
}

@keyframes wave {
    to {
        width: 330px;
        height: 330px;
        opacity: 0;
        margin-left: -157px;
        margin-top: -157px;
    }
}

.particle {
    position: fixed;
    z-index: 9;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    pointer-events: none;
    background: #fff;
    box-shadow: 0 0 9px 2px #8c82ff;
    animation: particleFly var(--duration, 1.2s) ease-out forwards;
}

@keyframes particleFly {
    to {
        transform:
            translate(var(--dx), var(--dy))
            scale(0);
        opacity: 0;
    }
}

@media (max-height: 700px) {
    .page { padding-top: 18px; }
    .scene { height: 320px; }
    .photo-wrap { transform: scale(.85); }
}
</style>
</head>

<body>

<div class="nebula"></div>
<canvas id="universe"></canvas>
<div class="flash" id="flash"></div>

<main class="page">

    <div class="badge">THE GOAT EXPERIENCE</div>

    <h1>CR7 GALAXY</h1>

    <p class="subtitle">ONE LEGEND · ONE CELEBRATION</p>

    <section class="scene" id="scene">

        <div class="orbit"></div>
        <div class="orbit two"></div>
        <div class="orbit three"></div>

        <div class="planet"></div>

        <div class="photo-wrap" id="hero">
            <img
                id="ronaldo"
                src="https://commons.wikimedia.org/wiki/Special:FilePath/C%C3%A9l%C3%A9bration_de_C.Ronaldo.jpg"
                alt="Cristiano Ronaldo celebrando un gol"
            >
            <div class="photo-label">CRISTIANO RONALDO</div>
        </div>

    </section>

    <div id="siuuu">SIUUUU!</div>

    <p class="info">PORTUGAL · NUMBER 7 · LEGEND</p>

    <button class="button" id="celebrate">
        ⚡ ACTIVAR CELEBRACIÓN
    </button>

    <p class="hint">
        Toca la pantalla y desata el poder del GOAT.<br>
        Cada toque crea una explosión galáctica. ✦
    </p>

    <footer class="footer">
        RONALDO · THE GOAT
    </footer>

</main>

<script>
const canvas = document.getElementById("universe");
const ctx = canvas.getContext("2d");

let W, H, stars = [];
let shootingStars = [];
let lastTime = 0;

function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    stars = Array.from({length: Math.min(240, Math.floor(W * H / 3000))},
        () => ({
            x: Math.random() * W,
            y: Math.random() * H,
            r: Math.random() * 1.7 + .2,
            a: Math.random(),
            speed: Math.random() * 1.5 + .2,
            phase: Math.random() * 6.28
        })
    );
}

window.addEventListener("resize", resize);
resize();

function draw(time = 0) {
    const dt = Math.min((time - lastTime) / 16.67 || 1, 2);
    lastTime = time;

    ctx.clearRect(0, 0, W, H);

    for (const s of stars) {
        s.phase += .012 * dt;

        const alpha = .25 + (Math.sin(s.phase) + 1) * .35;

        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(225,230,255,${alpha})`;
        ctx.fill();

        if (s.r > 1.35) {
            ctx.strokeStyle = `rgba(160,180,255,${alpha * .6})`;
            ctx.lineWidth = .5;
            ctx.beginPath();
            ctx.moveTo(s.x - 4, s.y);
            ctx.lineTo(s.x + 4, s.y);
            ctx.moveTo(s.x, s.y - 4);
            ctx.lineTo(s.x, s.y + 4);
            ctx.stroke();
        }
    }

    shootingStars = shootingStars.filter(s => s.life > 0);

    for (const s of shootingStars) {
        ctx.beginPath();
        ctx.moveTo(s.x, s.y);
        ctx.lineTo(s.x - s.vx * 8, s.y - s.vy * 8);
        ctx.strokeStyle = `rgba(210,225,255,${s.life})`;
        ctx.lineWidth = 2;
        ctx.stroke();

        s.x += s.vx * dt;
        s.y += s.vy * dt;
        s.life -= .018 * dt;
    }

    if (Math.random() < .012) {
        shootingStars.push({
            x: Math.random() * W,
            y: Math.random() * H * .55,
            vx: 7 + Math.random() * 5,
            vy: 3 + Math.random() * 4,
            life: 1
        });
    }

    requestAnimationFrame(draw);
}

requestAnimationFrame(draw);

const hero = document.getElementById("hero");
const siuuu = document.getElementById("siuuu");
const flash = document.getElementById("flash");
const button = document.getElementById("celebrate");

let lastCelebration = 0;

function particleBurst(x, y, amount = 85) {
    for (let i = 0; i < amount; i++) {
        const p = document.createElement("span");
        p.className = "particle";

        p.style.left = x + "px";
        p.style.top = y + "px";

        const angle = Math.random() * Math.PI * 2;
        const distance = 45 + Math.random() * 230;

        p.style.setProperty("--dx",
            Math.cos(angle) * distance + "px");
        p.style.setProperty("--dy",
            Math.sin(angle) * distance + "px");
        p.style.setProperty("--duration",
            (.65 + Math.random() * 1.15) + "s");

        const size = 2 + Math.random() * 5;
        p.style.width = size + "px";
        p.style.height = size + "px";

        const colors = [
            "#ffffff", "#b6a5ff", "#6beaff",
            "#ffd98a", "#ff7db7"
        ];

        p.style.background =
            colors[Math.floor(Math.random() * colors.length)];

        document.body.appendChild(p);
        setTimeout(() => p.remove(), 1900);
    }
}

function shockwave(x, y) {
    const wave = document.createElement("div");
    wave.className = "shockwave";

    wave.style.left = x + "px";
    wave.style.top = y + "px";
    wave.style.marginLeft = "-7px";
    wave.style.marginTop = "-7px";

    document.body.appendChild(wave);
    setTimeout(() => wave.remove(), 1100);
}

function celebrate(x, y) {
    const now = Date.now();

    if (now - lastCelebration < 550) return;
    lastCelebration = now;

    const rect = hero.getBoundingClientRect();
    const cx = x ?? rect.left + rect.width / 2;
    const cy = y ?? rect.top + rect.height / 2;

    particleBurst(cx, cy, 100);
    shockwave(cx, cy);

    flash.classList.remove("go");
    void flash.offsetWidth;
    flash.classList.add("go");

    hero.animate([
        {
            transform: "translateY(0) scale(1) rotate(0deg)"
        },
        {
            transform: "translateY(-75px) scale(1.12) rotate(-5deg)",
            offset: .3
        },
        {
            transform: "translateY(-100px) scale(1.15) rotate(4deg)",
            offset: .48
        },
        {
            transform: "translateY(0) scale(1.04) rotate(0deg)",
            offset: .75
        },
        {
            transform: "translateY(0) scale(1) rotate(0deg)"
        }
    ], {
        duration: 1000,
        easing: "cubic-bezier(.2,.8,.3,1)"
    });

    siuuu.classList.remove("pop");
    void siuuu.offsetWidth;
    siuuu.classList.add("pop");

    setTimeout(() => {
        const r = siuuu.getBoundingClientRect();
        particleBurst(r.left + r.width / 2,
                      r.top + r.height / 2, 55);
    }, 430);

    if (navigator.vibrate) {
        navigator.vibrate([60, 35, 100]);
    }
}

button.addEventListener("click", event => {
    event.stopPropagation();
    celebrate();
});

document.addEventListener("pointerdown", event => {
    if (event.target.closest("button")) return;
    celebrate(event.clientX, event.clientY);
});
</script>

</body>
</html>
