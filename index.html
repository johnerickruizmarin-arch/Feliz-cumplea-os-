<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CR7 | SIUUU GALAXY</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    background: #03000d;
    color: white;
    font-family: Arial, sans-serif;
    touch-action: manipulation;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}

#intro {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    z-index: 2;
    padding: 20px;
    pointer-events: none;
    transition: opacity 0.5s;
}

#intro h1 {
    font-size: clamp(35px, 9vw, 65px);
    color: #ffe9a0;
    text-shadow: 0 0 15px #ff8c00, 0 0 35px #ff00ff;
}

#intro p {
    margin-top: 18px;
    font-size: 17px;
    color: #d8d5ff;
}

#tap {
    margin-top: 28px;
    padding: 15px 25px;
    border: 1px solid #bca7ff;
    border-radius: 40px;
    background: #4c168b66;
    color: white;
    box-shadow: 0 0 25px #853cff;
    animation: pulse 1.5s infinite;
}

#reveal {
    position: absolute;
    inset: 0;
    z-index: 3;
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    text-align: center;
    pointer-events: none;
}

#player {
    width: min(70vw, 310px);
    height: min(48vh, 350px);
    filter: drop-shadow(0 0 25px #ff9d00);
    animation: entrance 1s cubic-bezier(.2,1.8,.4,1) both;
}

#siuuu {
    font-size: clamp(42px, 12vw, 85px);
    font-weight: 1000;
    font-style: italic;
    color: #fff4a1;
    text-shadow: 0 0 12px #ff8c00,
                 0 0 30px #ff3c00,
                 0 0 60px #ff00d9;
    animation: siuuu 0.7s infinite alternate;
}

#subtitle {
    margin-top: 10px;
    letter-spacing: 5px;
    font-size: 15px;
    color: #ffffff;
    text-shadow: 0 0 15px #9b68ff;
}

#again {
    position: absolute;
    bottom: 25px;
    z-index: 5;
    padding: 12px 20px;
    color: white;
    border: 1px solid #a78bfa;
    background: #251044cc;
    border-radius: 30px;
    display: none;
}

@keyframes pulse {
    50% { transform: scale(1.08); box-shadow: 0 0 40px #c000ff; }
}

@keyframes entrance {
    from { transform: scale(0) rotate(-25deg); opacity: 0; }
    to { transform: scale(1) rotate(0); opacity: 1; }
}

@keyframes siuuu {
    from { transform: scale(1); }
    to { transform: scale(1.09); }
}
</style>
</head>

<body>

<canvas id="space"></canvas>

<div id="intro">
    <h1>CR7 GALAXY</h1>
    <p>El universo del mejor ⚽🐐</p>
    <div id="tap">👆 TOCA LA PANTALLA</div>
</div>

<div id="reveal">

    <!-- Futbolista estilizado con el número 7 -->
    <svg id="player" viewBox="0 0 300 350"
         xmlns="http://www.w3.org/2000/svg">

        <defs>
            <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#ff334f"/>
                <stop offset="50%" stop-color="#a90025"/>
                <stop offset="100%" stop-color="#420019"/>
            </linearGradient>

            <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
                <stop stop-color="#ffd2a1"/>
                <stop offset="100%" stop-color="#a95d38"/>
            </linearGradient>
        </defs>

        <!-- Piernas en pose de celebración -->
        <path d="M105 235 L92 315 L65 335 L78 345
                 L119 330 L143 246 Z" fill="#e9e9f5"/>

        <path d="M180 235 L206 300 L240 315 L230 330
                 L185 322 L150 250 Z" fill="#d9d9e8"/>

        <!-- Botas -->
        <path d="M65 329 L43 337 L41 348 L85 348 L86 337 Z"
              fill="#11111d"/>
        <path d="M228 314 L247 315 L263 328 L254 336
                 L222 330 Z" fill="#11111d"/>

        <!-- Cuerpo -->
        <path d="M108 108 L76 125 L91 202 L103 250
                 Q150 272 199 250 L211 180 L225 126
                 L190 108 Z" fill="url(#shirt)"/>

        <!-- Brazos levantados -->
        <path d="M84 126 L60 89 L38 47 L24 53
                 L42 108 L65 153 Z" fill="url(#skin)"/>

        <path d="M209 126 L235 88 L258 47 L272 53
                 L254 108 L229 153 Z" fill="url(#skin)"/>

        <!-- Mangas -->
        <path d="M82 119 L65 132 L78 159 L100 145 Z"
              fill="#d51b3d"/>
        <path d="M210 119 L229 132 L218 159 L194 145 Z"
              fill="#d51b3d"/>

        <!-- Cuello -->
        <rect x="132" y="88" width="36" height="32"
              rx="10" fill="url(#skin)"/>

        <!-- Cabeza -->
        <path d="M112 39 Q113 8 150 8 Q187 8 188 43
                 L180 82 Q169 103 150 103
                 Q128 100 119 80 Z"
              fill="url(#skin)"/>

        <!-- Pelo -->
        <path d="M111 48 Q99 8 145 2 Q185 -1 190 35
                 L184 49 L175 29 L143 25 L120 37 L118 55 Z"
              fill="#17121a"/>

        <!-- Rasgos simplificados -->
        <path d="M126 52 L142 52 M159 52 L175 52"
              stroke="#34201c" stroke-width="4"
              stroke-linecap="round"/>

        <path d="M139 75 Q151 83 164 74"
              stroke="#6d2525" stroke-width="4"
              fill="none" stroke-linecap="round"/>

        <!-- Número 7 -->
        <text x="150" y="193" text-anchor="middle"
              font-family="Arial" font-size="65"
              font-weight="900" fill="#fff5df"
              stroke="#ffd2a1" stroke-width="1">7</text>

        <text x="150" y="217" text-anchor="middle"
              font-family="Arial" font-size="13"
              font-weight="bold" fill="#fff5df"
              letter-spacing="3">CR7</text>
    </svg>

    <div id="siuuu">SIUUUU!</div>
    <div id="subtitle">RONALDO · THE GOAT</div>
</div>

<button id="again">🌌 VOLVER A EMPEZAR</button>

<script>
const canvas = document.getElementById("space");
const ctx = canvas.getContext("2d");

let w, h, stars = [], particles = [];
let activated = false;
let galaxyAngle = 0;

function resize() {
    w = canvas.width = innerWidth * devicePixelRatio;
    h = canvas.height = innerHeight * devicePixelRatio;
    canvas.style.width = innerWidth + "px";
    canvas.style.height = innerHeight + "px";
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);

    stars = Array.from({length: 230}, () => ({
        x: Math.random() * innerWidth,
        y: Math.random() * innerHeight,
        r: Math.random() * 1.8 + 0.3,
        a: Math.random() * Math.PI * 2,
        speed: Math.random() * 0.025 + 0.005
    }));
}

function drawGalaxy() {
    const W = innerWidth;
    const H = innerHeight;
    const cx = W / 2;
    const cy = H / 2;

    ctx.clearRect(0, 0, W, H);

    const bg = ctx.createRadialGradient(
        cx, cy, 0, cx, cy, Math.max(W, H) * 0.8
    );

    bg.addColorStop(0, "#170b3b");
    bg.addColorStop(0.45, "#080b25");
    bg.addColorStop(1, "#02010a");

    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // Brazos giratorios de la galaxia
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(galaxyAngle);

    for (let arm = 0; arm < 4; arm++) {
        for (let i = 0; i < 110; i++) {
            const t = i / 110;
            const angle = t * 5.5 + arm * Math.PI / 2;
            const radius = t * Math.min(W, H) * 0.47;

            const x = Math.cos(angle) * radius;
            const y = Math.sin(angle) * radius * 0.68;

            ctx.beginPath();
            ctx.arc(x, y, Math.random() * 1.5 + 0.4, 0, Math.PI * 2);
            ctx.fillStyle = arm % 2
                ? "rgba(172,115,255,0.7)"
                : "rgba(255,160,220,0.65)";
            ctx.fill();
        }
    }

    ctx.restore();
    galaxyAngle += 0.0015;

    // Estrellas que titilan
    for (const s of stars) {
        s.a += s.speed;

        const brightness = 0.45 + Math.sin(s.a) * 0.45;

        ctx.globalAlpha = brightness;
        ctx.fillStyle = "#ffffff";
        ctx.shadowBlur = 7;
        ctx.shadowColor = "#a9caff";

        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;

    // Partículas de energía
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];

        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.985;
        p.vy *= 0.985;
        p.life--;

        ctx.globalAlpha = Math.max(0, p.life / 90);
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 12;
        ctx.shadowColor = p.color;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();

        if (p.life <= 0) particles.splice(i, 1);
    }

    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;

    requestAnimationFrame(drawGalaxy);
}

function explosion(x, y) {
    const colors = ["#ffffff", "#ffe66d", "#ff8a00", "#b56cff", "#ff49b6"];

    for (let i = 0; i < 190; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 8 + 1;

        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            size: Math.random() * 3 + 1,
            life: Math.random() * 70 + 25,
            color: colors[Math.floor(Math.random() * colors.length)]
        });
    }
}

function reveal(x, y) {
    if (activated) {
        explosion(x, y);
        return;
    }

    activated = true;

    document.getElementById("intro").style.opacity = "0";

    setTimeout(() => {
        document.getElementById("intro").style.display = "none";
        document.getElementById("reveal").style.display = "flex";
        document.getElementById("again").style.display = "block";
    }, 350);

    explosion(x, y);
}

document.addEventListener("pointerdown", e => {
    if (e.target.id === "again") return;
    reveal(e.clientX, e.clientY);
});

document.getElementById("again").addEventListener("click", () => {
    activated = false;
    document.getElementById("reveal").style.display = "none";
    document.getElementById("again").style.display = "none";
    document.getElementById("intro").style.display = "flex";
    document.getElementById("intro").style.opacity = "1";
    particles = [];
});

addEventListener("resize", resize);

resize();
drawGalaxy();
</script>

</body>
</html>
