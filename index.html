<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz cumpleaños, Lulu 💖</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  overflow:hidden;
  background:#02010a;
  color:white;
  font-family:Arial,sans-serif;
  height:100vh;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
}

.contenido{
  position:relative;
  z-index:2;
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:25px;
}

h1{
  font-size:clamp(38px,10vw,75px);
  margin-bottom:18px;
  color:#fff;
  text-shadow:
    0 0 10px #fff,
    0 0 25px #ff6bd6,
    0 0 50px #9b5cff;
  animation:latido 2s infinite;
}

p{
  font-size:clamp(18px,5vw,28px);
  max-width:650px;
  line-height:1.5;
  text-shadow:0 0 12px #ff8ee8;
}

.corazon{
  font-size:55px;
  margin-top:25px;
  animation:flotar 2s ease-in-out infinite;
}

@keyframes latido{
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.06);}
}

@keyframes flotar{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-15px);}
}

.nota{
  position:absolute;
  bottom:20px;
  font-size:12px;
  opacity:.55;
}
</style>
</head>

<body>

<canvas id="galaxia"></canvas>

<div class="contenido">
  <h1>Feliz cumpleaños, Lulu 💖</h1>

  <p>
    ✨ Que este nuevo año de tu vida esté lleno de
    momentos increíbles, sonrisas, sueños cumplidos
    y muchísima felicidad. ✨
  </p>

  <div class="corazon">💗</div>

  <div class="nota">Una pequeña galaxia hecha especialmente para ti 🌌</div>
</div>

<script>
const canvas = document.getElementById("galaxia");
const ctx = canvas.getContext("2d");

let estrellas = [];
let particulas = [];

function ajustar(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

window.addEventListener("resize", ajustar);
ajustar();

function crearEstrellas(){
  estrellas = [];

  for(let i=0;i<250;i++){
    estrellas.push({
      x:Math.random()*canvas.width,
      y:Math.random()*canvas.height,
      r:Math.random()*2+0.2,
      brillo:Math.random(),
      velocidad:Math.random()*0.02+0.005
    });
  }
}

function crearParticulas(){
  particulas=[];

  for(let i=0;i<500;i++){
    const angulo=Math.random()*Math.PI*2;
    const radio=Math.random()*Math.min(canvas.width,canvas.height)*0.45;

    particulas.push({
      angulo:angulo,
      radio:radio,
      velocidad:(Math.random()*0.0008)+0.0002,
      tamaño:Math.random()*2+0.3
    });
  }
}

crearEstrellas();
crearParticulas();

function animar(){
  ctx.fillStyle="#02010a";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // Estrellas
  estrellas.forEach(e=>{
    e.brillo += e.velocidad;

    const alpha=
      0.35+
      Math.abs(Math.sin(e.brillo))*0.65;

    ctx.beginPath();
    ctx.arc(e.x,e.y,e.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${alpha})`;
    ctx.fill();
  });

  // Galaxia
  const cx=canvas.width/2;
  const cy=canvas.height/2;

  particulas.forEach(p=>{
    p.angulo += p.velocidad;

    const x=
      cx+
      Math.cos(p.angulo)*p.radio;

    const y=
      cy+
      Math.sin(p.angulo)*p.radio*0.45;

    const brillo=
      Math.max(
        0.05,
        1-p.radio/(Math.min(canvas.width,canvas.height)*0.45)
      );

    ctx.beginPath();
    ctx.arc(x,y,p.tamaño,0,Math.PI*2);

    ctx.fillStyle=
      `rgba(220,150,255,${brillo})`;

    ctx.fill();
  });

  // Núcleo brillante
  const gradiente=ctx.createRadialGradient(
    cx,cy,0,
    cx,cy,Math.min(canvas.width,canvas.height)*0.35
  );

  gradiente.addColorStop(0,"rgba(255,120,230,0.20)");
  gradiente.addColorStop(0.35,"rgba(150,80,255,0.08)");
  gradiente.addColorStop(1,"rgba(0,0,0,0)");

  ctx.fillStyle=gradiente;
  ctx.beginPath();
  ctx.arc(
    cx,
    cy,
    Math.min(canvas.width,canvas.height)*0.35,
    0,
    Math.PI*2
  );
  ctx.fill();

  requestAnimationFrame(animar);
}

animar();
</script>

</body>
    </html>
